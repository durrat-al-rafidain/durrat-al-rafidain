<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فيديو توضيحي | درة الرافدين</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Cuneiform&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1526;--ink:#eee7d3;--mute:#a9b0c2;--gold:#d9ae4b;--lapis:#7fa2ee;--card:#14203a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
#stage{position:relative;width:100%;max-width:960px;aspect-ratio:16/9;background:radial-gradient(circle at 50% 30%,#182a52,#0d1526 70%);border:2px solid var(--gold);border-radius:6px;overflow:hidden}
#cune{position:absolute;inset:0;pointer-events:none}
#cune span{position:absolute;font-family:"Noto Sans Cuneiform","Segoe UI Historic",serif;color:var(--gold);opacity:0;animation:glow var(--d) ease-in-out infinite;animation-delay:var(--l)}
@keyframes glow{0%,100%{opacity:0}50%{opacity:var(--o)}}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4%;opacity:0;visibility:hidden;transition:opacity .7s}
.scene.on{opacity:1;visibility:visible}
.ico{font-family:'Noto Sans Cuneiform','Segoe UI Historic',serif;color:var(--gold);font-size:clamp(2.4rem,9vw,5rem);line-height:1}
.badge{width:clamp(42px,8vw,70px);height:clamp(42px,8vw,70px);border-radius:50%;background:var(--gold);color:#0d1526;display:grid;place-items:center;font-weight:700;font-size:clamp(1.3rem,4vw,2.4rem);margin-bottom:2%}
h1,h2{font-family:Amiri,serif;margin:.2em 0;color:var(--gold);line-height:1.25}
h1{font-size:clamp(2.4rem,9vw,5.4rem)}
h2{font-size:clamp(1.6rem,5.5vw,3.2rem)}
p{margin:.3em 0;font-size:clamp(.95rem,2.8vw,1.7rem);max-width:80%;line-height:1.7}
.list{display:grid;grid-template-columns:1fr 1fr;gap:2% 4%;margin-top:2%;font-size:clamp(.9rem,2.6vw,1.5rem)}
.list div{border:1px solid var(--gold);padding:.5em 1em;border-radius:4px;background:rgba(20,32,58,.8)}
.num{direction:ltr;color:var(--gold);font-weight:700;font-size:clamp(1.2rem,4vw,2.4rem)}
#ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:700;background:var(--gold);color:#0d1526;border:0;border-radius:6px;padding:9px 18px;cursor:pointer}
button.o{background:transparent;color:var(--gold);border:2px solid var(--gold)}
.lnk{background:var(--gold);color:#0d1526;border-radius:6px;padding:9px 18px;font-weight:700;text-decoration:none}
.lnk:focus-visible,button:focus-visible{outline:3px solid var(--lapis);outline-offset:2px}
#dots{display:flex;gap:6px}
#dots i{width:26px;height:6px;border-radius:3px;background:#2b3a5c}
#dots i.on{background:var(--gold)}
@media (prefers-reduced-motion:reduce){#cune span{animation:none;opacity:.08}.scene{transition:none}}
</style>
</head>
<body>
<div id="stage"><div id="cune" aria-hidden="true"></div></div>
<div id="dots"></div>
<div id="ctrl">
  <button id="play">إيقاف</button>
  <button class="o" id="prev">السابق</button>
  <button class="o" id="next">التالي</button>
  <button class="o" id="voice">الصوت: مغلق</button>
  <button class="o" id="restart">إعادة</button>
  <a class="lnk" href="index.html" target="_blank" rel="noopener">الانتقال إلى الموقع</a>
</div>
<script>
var S=[
{h:'درة الرافدين',t:'للمحاماة والاستشارات القانونية وتوثيق العقود. من أرض الرافدين، حيث كُتبت أولى العقود على الطين، نحفظ حقك بعقد واضح وموثّق.',ico:'𒀭',big:1},
{h:'خدماتنا',t:'أربع خدمات تكفيك: محاماة وترافع، واستشارات قانونية، وخدمات عقارية، وتوثيق العقود.',list:['المحاماة والترافع','الاستشارات القانونية','العقارات','توثيق العقود']},
{n:'١',h:'تتواصل معنا',t:'اتصل بنا أو راسلنا على واتساب أو تلغرام، واشرح حالتك باختصار.',ico:'𒁹'},
{n:'٢',h:'نستمع ونحدد الاستشارة',t:'نفهم طلبك، ونخبرك بالأوراق التي تحتاجها قبل اللقاء.',ico:'𒄑'},
{n:'٣',h:'ندقق المستندات',t:'نراجع سند الملكية والهويات والوثائق، ونتأكد أن المعاملة سليمة وخالية من العوائق.',ico:'𒆠'},
{n:'٤',h:'نصوغ العقد',t:'نكتب العقد ببنود واضحة تحفظ حق الطرفين، ونشرحه لك بندًا بندًا قبل التوقيع.',ico:'𒈗'},
{n:'٥',h:'نوثّق ونصدّق',t:'نتابع إجراءات التوثيق مع الجهات الرسمية المختصة نيابةً عنك، فلا تحتاج مراجعة الدوائر.',ico:'𒉿'},
{n:'٦',h:'تستلم وتطمئن',t:'تستلم نسختك الموثقة، ونبقى متاحين لأي سؤال بعد ذلك.',ico:'𒋼'},
{h:'تواصل معنا',t:'المحامي علي حسين صالح والمدير التنفيذي حسين علي حسين بخدمتك على الاتصال والواتساب والتلغرام.',nums:['المحامي علي حسين صالح ‏07722244476','حسين علي حسين، المدير التنفيذي ‏07718881507'],ico:'𒀯'}
];
var st=document.getElementById('stage'),dots=document.getElementById('dots');
S.forEach(function(s,i){
  var d=document.createElement('div');d.className='scene';
  var h=(s.n?'<div class="badge">'+s.n+'</div>':'')+(s.ico&&!s.n?'<div class="ico">'+s.ico+'</div>':'');
  h+=(s.big?'<h1>':'<h2>')+s.h+(s.big?'</h1>':'</h2>');
  h+='<p>'+s.t+'</p>';
  if(s.n)h+='<div class="ico" style="margin-top:2%">'+s.ico+'</div>';
  if(s.list)h+='<div class="list">'+s.list.map(function(x){return'<div>'+x+'</div>'}).join('')+'</div>';
  if(s.nums)h+='<a class="lnk" style="margin-top:2%" href="index.html" target="_blank" rel="noopener">زيارة الموقع</a>';
  if(s.nums)h+=s.nums.map(function(x){var p=x.split('‏');return'<p><b>'+p[0]+'</b> <span class="num">'+p[1]+'</span></p>'}).join('');
  d.innerHTML=h;st.appendChild(d);
  var k=document.createElement('i');dots.appendChild(k);
});
var sc=st.querySelectorAll('.scene'),dt=dots.querySelectorAll('i'),cur=-1,timer,playing=true,voice=false;
function go(i){
  clearTimeout(timer);
  if(i>=S.length){playing=false;document.getElementById('play').textContent='تشغيل';i=S.length-1;}
  if(i<0)i=0;
  cur=i;
  sc.forEach(function(e,j){e.classList.toggle('on',j===i);dt[j].classList.toggle('on',j<=i)});
  try{speechSynthesis.cancel()}catch(e){}
  if(!playing&&!voice)return;
  var done=function(){if(playing)timer=setTimeout(function(){go(cur+1)},2000)};
  if(voice&&'speechSynthesis' in window){
    try{var u=new SpeechSynthesisUtterance(S[i].h+'. '+S[i].t);u.lang='ar-SA';u.onend=done;u.onerror=function(){timer=setTimeout(done,9000)};speechSynthesis.speak(u);}catch(e){timer=setTimeout(done,9000)}
  }else if(playing){timer=setTimeout(done,Math.max(10000,S[i].t.length*150))}
}
document.getElementById('play').onclick=function(){
  playing=!playing;this.textContent=playing?'إيقاف':'تشغيل';
  if(playing){if(cur>=S.length-1)cur=-1;go(cur+1>S.length-1?0:cur);}else{clearTimeout(timer);try{speechSynthesis.cancel()}catch(e){}}
};
document.getElementById('next').onclick=function(){go(Math.min(cur+1,S.length-1))};
document.getElementById('prev').onclick=function(){go(Math.max(cur-1,0))};
document.getElementById('restart').onclick=function(){playing=true;document.getElementById('play').textContent='إيقاف';go(0)};
document.getElementById('voice').onclick=function(){voice=!voice;this.textContent=voice?'الصوت: مفتوح':'الصوت: مغلق';go(cur)};
// cuneiform background
(function(){var b=document.getElementById('cune'),n=36;for(var i=0;i<n;i++){var s=document.createElement('span');s.textContent=String.fromCodePoint(0x12000+Math.floor(Math.random()*880));s.style.left=Math.random()*96+'%';s.style.top=Math.random()*90+'%';s.style.fontSize=(14+Math.random()*20)+'px';s.style.setProperty('--d',(5+Math.random()*6)+'s');s.style.setProperty('--l',(-Math.random()*10)+'s');s.style.setProperty('--o',(0.12+Math.random()*0.2).toFixed(2));b.appendChild(s)}})();
go(0);
</script>
</body>
</html>
